<style>
  /* The logo's own colours (no theme token has them): dark, then light. */
  #brand-intro { --brand-req: #199c7e; --brand-arc: #3a86e6; }
  :root[data-theme="light"] #brand-intro { --brand-req: #0f7f66; --brand-arc: #1667c4; }

  #brand-intro { position: fixed; inset: 0; z-index: 10000; background: var(--bg);
    place-items: center; overflow: hidden; opacity: 1; transition: opacity .25s ease; }
  #brand-intro:not([hidden]) { display: grid; }
  #brand-intro.bi-out { opacity: 0; }
  #brand-intro .bi-stack { display: flex; flex-direction: column; align-items: center;
    gap: clamp(.6rem, 2.5vh, 1.4rem); }

  /* the helix: each strand is uncovered from the base line upwards, so the
     strands seem to wind themselves up. Both take 1.6s at a steady pace:
     green from 0s, blue from .08s, so blue already fills each gap in the
     green strand when the green one gets there. */
  #brand-intro .bi-logo { width: min(160px, 36vw); height: auto; overflow: visible; }
  #brand-intro .bi-req { fill: var(--brand-req); }
  #brand-intro .bi-arc { fill: var(--brand-arc); }
  #brand-intro .bi-strand { clip-path: inset(100% 0 0 0);
    animation: bi-wind 1.6s cubic-bezier(.3,.05,.5,1) forwards; }
  #brand-intro .bi-strand.bi-arc { animation-delay: .08s; }
  @keyframes bi-wind {
    from { clip-path: inset(100% 0 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  /* the wordmark "systems42" in Bricolage Grotesque, the dashboard's text
     face (weight 700, letter-spacing -.02em), drawn as paths: the intro's
     frame loads no fonts. 100 units are 1em. The first "s" rises in with
     the green strand, the other letters from .08s with the blue, .17s apart. */
  #brand-intro .bi-word { height: clamp(2.2rem, 9vw, 4rem); width: auto; overflow: visible; }
  #brand-intro .bi-word path { fill: var(--ink); opacity: 0;
    animation: bi-rise .4s cubic-bezier(.2,.8,.3,1) forwards;
    animation-delay: calc(-.09s + var(--i) * .17s); }
  #brand-intro .bi-word path:first-child { animation-delay: 0s; }
  #brand-intro .bi-word .bi-num { fill: var(--brand-req); }

  /* the second line "dashboard", in the same face as paths, about half the
     height of "systems42" and left-aligned with it. It rises in after the
     "2" of "42" has landed, its letters .03s apart. */
  #brand-intro .bi-lines { display: flex; flex-direction: column; align-items: flex-start;
    gap: clamp(.1rem, .6vh, .3rem); }
  #brand-intro .bi-sub { height: clamp(1.2rem, 5vw, 2.2rem); width: auto; overflow: visible; }
  #brand-intro .bi-sub path { fill: var(--ink); opacity: 0;
    animation: bi-rise .4s cubic-bezier(.2,.8,.3,1) forwards;
    animation-delay: calc(1.35s + var(--i) * .03s); }
  @keyframes bi-rise {
    from { opacity: 0; transform: translateY(50px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { #brand-intro { display: none !important; } }
</style>
<script>
(function () {
  var el = document.getElementById('brand-intro');
  if (!el) return;
  var KEY = 'brand-intro-seen';
  function done() {
    if (!el) return;
    document.removeEventListener('click', done, true);
    document.removeEventListener('keydown', done, true);
    clearTimeout(t1); clearTimeout(t2);
    el.remove(); el = null;
  }
  var t1, t2;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
  try { if (sessionStorage.getItem(KEY)) { el.remove(); return; } sessionStorage.setItem(KEY, '1'); } catch (e) { /* storage blocked: show every time */ }
  el.hidden = false;
  document.addEventListener('click', done, true);
  document.addEventListener('keydown', done, true);
  t1 = setTimeout(function () { if (el) el.classList.add('bi-out'); }, 2150);
  t2 = setTimeout(done, 2400);
})();
</script>
