<style>
  #brand-intro { position: fixed; inset: 0; z-index: 10000; background: var(--bg);
    place-items: center; overflow: hidden; opacity: 1; transition: opacity .3s ease; }
  #brand-intro:not([hidden]) { display: grid; }
  #brand-intro.bi-out { opacity: 0; }
  #brand-intro .bi-stack { display: flex; flex-direction: column; align-items: center;
    gap: clamp(.6rem, 2.5vh, 1.4rem); perspective: 900px; }

  /* the mark: arches from the sides, then the ribbon twists in bottom to top */
  #brand-intro .bi-logo { width: min(150px, 34vw); height: auto; overflow: visible; }
  #brand-intro .bi-arch { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0;
    animation: bi-arch .6s cubic-bezier(.2,.85,.25,1.08) forwards; }
  #brand-intro .bi-arch-l { fill: var(--accent-2); --ax: -70%; --ar: -28deg; }
  #brand-intro .bi-arch-r { fill: var(--accent);   --ax:  70%; --ar:  28deg; animation-delay: .08s; }
  @keyframes bi-arch {
    from { opacity: 0; transform: translateX(var(--ax)) rotate(var(--ar)); }
    40%  { opacity: 1; }
    to   { opacity: 1; transform: none; }
  }
  #brand-intro .bi-ribbon { fill: var(--ink); }
  #brand-intro .bi-ribbon > g { transform-box: fill-box; transform-origin: 50% 50%;
    opacity: 0; animation: bi-twist .38s cubic-bezier(.3,.9,.3,1) forwards;
    animation-delay: calc(.22s + (6 - var(--k)) * .045s); }
  @keyframes bi-twist {
    from { opacity: 0; transform: rotateY(90deg) scaleX(.2); }
    to   { opacity: 1; transform: none; }
  }

  /* the wordmark: every letter flies in from its own corner of the window,
     spinning, and lands with a small overshoot */
  #brand-intro .bi-word { font-family: var(--font-text); font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 4rem); line-height: 1; letter-spacing: -.02em;
    color: var(--ink); white-space: nowrap; }
  #brand-intro .bi-word span { display: inline-block; opacity: 0;
    animation: bi-fly .72s cubic-bezier(.18,.9,.3,1.12) forwards;
    animation-delay: calc(.32s + var(--i) * .06s); }
  #brand-intro .bi-word .bi-num { color: var(--accent); }
  @keyframes bi-fly {
    from { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--r)) rotateY(80deg) scale(.35); }
    35%  { opacity: 1; }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { #brand-intro { display: none !important; } }
</style>
<script>
(function () {
  var el = document.getElementById('brand-intro');
  if (!el) return;
  var KEY = 'brand-intro-seen';
  function done() {
    if (!el) return;
    document.removeEventListener('click', done, true);
    document.removeEventListener('keydown', done, true);
    clearTimeout(t1); clearTimeout(t2);
    el.remove(); el = null;
  }
  var t1, t2;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
  try { if (sessionStorage.getItem(KEY)) { el.remove(); return; } sessionStorage.setItem(KEY, '1'); } catch (e) { /* storage blocked: show every time */ }
  el.hidden = false;
  document.addEventListener('click', done, true);
  document.addEventListener('keydown', done, true);
  t1 = setTimeout(function () { if (el) el.classList.add('bi-out'); }, 1900);
  t2 = setTimeout(done, 2200);
})();
</script>
