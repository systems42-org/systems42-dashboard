<style>
  /* the brand's own colours, one declaration per theme: the lockup's
     dark variant on the dark default, its grey on the light theme */
  #atrium-splash { --brand-ink: #efe9df; --brand-orange: #f29400; }
  :root[data-theme="light"] #atrium-splash { --brand-ink: #767a7d; }
  .atrium-splash {
    position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
    background: var(--bg); cursor: pointer; transition: opacity .4s ease;
  }
  .atrium-splash[hidden] { display: none; }
  .atrium-splash.is-leaving { opacity: 0; pointer-events: none; }
  .atrium-intro { display: block; width: min(80vw, 760px); height: auto; overflow: visible; }
  .atrium-intro .intro-ink { fill: var(--brand-ink); }
  .atrium-intro .intro-orange { fill: var(--brand-orange); }
  /* pieces stay invisible while armed, so nothing shows in its final place first */
  .atrium-intro.is-armed .intro-piece { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .atrium-splash { display: none !important; } }
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById("atrium-splash");
  if (!el) { return; }
  var CENTRE = { x: 117, y: 79.7 };   // middle of the finished lockup, in group coordinates
  var reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (reduce) { el.remove(); return; }
  var seen = "";
  try {
    seen = sessionStorage.getItem("atrium-splash-seen");
    sessionStorage.setItem("atrium-splash-seen", "1");
  } catch (e) { /* storage blocked: show every time */ }
  if (seen) { el.remove(); return; }

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // Fly the pieces together, starting just outside the window's edges.
  function play(svg, dur, then) {
    var pieces = [].slice.call(svg.querySelectorAll(".intro-piece"));
    var box = el.getBoundingClientRect();
    var scale = svg.getScreenCTM().a || 1;               // px per SVG unit
    var r0 = Math.hypot(box.width, box.height) / 2 / scale + 30;
    var n = pieces.length;
    var meta = pieces.map(function (g, i) {
      var b = g.getBBox();
      var c = { x: b.x + b.width / 2, y: b.y + b.height / 2 };
      var entry = (i / n) * 2 * Math.PI + 0.4;             // every edge gets a piece
      var final = Math.atan2(c.y - CENTRE.y, c.x - CENTRE.x);
      while (final < entry) { final += 2 * Math.PI; }
      return {
        g: g, c: c, entry: entry, final: final,
        rf: Math.hypot(c.x - CENTRE.x, c.y - CENTRE.y),
        spin: (i % 2 ? 1 : -1) * (120 + 60 * (i % 3)),     // degrees, unwinding to 0
        delay: ((i * 37) % 160) / 1000,                    // share of the duration
      };
    });
    svg.classList.add("is-armed");
    var t0 = null;
    function step(now) {
      if (!el) { return; }
      if (t0 === null) { t0 = now; }
      var done = true;
      meta.forEach(function (m) {
        var p = Math.min(1, Math.max(0, ((now - t0) / dur - m.delay) / 0.84));
        if (p < 1) { done = false; }
        var e = easeOut(p);
        // angle and radius shrink together around the logo's centre: a spiral
        var a = lerp(m.entry + 2.2 * Math.PI, m.final, e);
        var r = lerp(r0, m.rf, e);
        var x = CENTRE.x + r * Math.cos(a), y = CENTRE.y + r * Math.sin(a);
        m.g.setAttribute("transform", "translate(" + x + " " + y + ") rotate(" + (1 - e) * m.spin +
          ") scale(" + lerp(0.4, 1, e) + ") translate(" + -m.c.x + " " + -m.c.y + ")");
        m.g.style.opacity = Math.min(1, p * 4);
      });
      if (done) {
        pieces.forEach(function (g) { g.removeAttribute("transform"); g.style.opacity = ""; });
        svg.classList.remove("is-armed");
        then();
      } else { requestAnimationFrame(step); }
    }
    requestAnimationFrame(step);
  }

  // Flies together, holds, fades. Any click or key ends it at once.
  var t1, t2;
  function done() {
    if (!el) { return; }
    document.removeEventListener("click", done, true);
    document.removeEventListener("keydown", done, true);
    clearTimeout(t1); clearTimeout(t2);
    el.remove(); el = null;
  }
  function leave() {
    if (!el) { return; }
    el.classList.add("is-leaving");
    t2 = setTimeout(done, 400);
  }
  el.hidden = false;
  document.addEventListener("click", done, true);
  document.addEventListener("keydown", done, true);
  t1 = setTimeout(leave, 1700);   // safety net: gone by about 2.1 s whatever the frame rate
  play(el.querySelector("svg"), 1000, function () { clearTimeout(t1); t1 = setTimeout(leave, 700); });
})();
</script>
