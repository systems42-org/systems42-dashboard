  <title id="dia-title">systems42 sections: req42, arc42 and common sections</title>
  <desc id="dia-desc">Three cabinets of sections. req42 (top left): R1 Vision &amp; Goals, R2 Resources &amp; Staff, R3 Functional Requirements, R4 Supporting Models, R5 Team Structure, R6 Roadmap. arc42 (top right): A1 Solution Strategy, A2 Building Block View, A3 Deployment View, A4 Runtime View, A5 Crosscutting Concepts, A6 Architecture Decisions. Common (bottom): C1 Quality Requirements, C2 Constraints, C3 Scope &amp; Context, C4 Stakeholders, C5 Domain Terms, C6 Risks &amp; Assumptions. Color: red = organization and project, blue = requirements (problem space), green = architecture (solution space), gradient = section shared by two areas.</desc>
