<!-- mermaid.js, vendored for offline use (static/vendor/mermaid.min.js, DR-013/ISS-010).
     The UMD build exposes globalThis.mermaid; classic <script nonce="{{ csp_nonce() }}"> so no CDN at runtime. -->
<script src="{{ url_for('static', filename='vendor/mermaid.min.js') }}"></script>
<script nonce="{{ csp_nonce() }}">
  (function () {
    if (!window.mermaid) { console.error("mermaid failed to load"); return; }

    // markdown renders ```mermaid as <pre><code class="language-mermaid">; lift it to a mermaid node
    document.querySelectorAll("pre > code.language-mermaid").forEach(function (c) {
      var pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = c.textContent;
      c.closest("pre").replaceWith(pre);
    });

    // Keep every diagram's source. mermaid.run() replaces a node's text with the
    // rendered SVG, and the palette is baked into that SVG rather than read from
    // CSS — so re-rendering under the other theme needs the original text back.
    var nodes = Array.prototype.slice.call(document.querySelectorAll("pre.mermaid"));
    nodes.forEach(function (n) { n.dataset.mermaidSrc = n.textContent; });

    // Each diagram scrolls and zooms by touch inside its own box (QR-001).
    // Below 781 px it keeps its natural size there instead of shrinking to
    // an unreadable picture.
    nodes.forEach(function (n) {
      if (n.parentElement.classList.contains("diagram-scroll")) { return; }
      var box = document.createElement("div");
      box.className = "diagram-scroll";
      n.replaceWith(box);
      box.appendChild(n);
    });
    var narrow = window.matchMedia("(max-width: 780px)").matches;

    // Tier subgraphs in the context diagram (DR-026) default to mermaid's
    // yellow cluster fill, which belongs to no palette on this dashboard.
    // Repaint them with the same soft card tokens style.css uses.
    var CLUSTER = {
      light: { clusterBkg: "#eaf1fa", clusterBorder: "#d2ddec", titleColor: "#4c5c7a" },
      dark:  { clusterBkg: "#14203a", clusterBorder: "#25345a", titleColor: "#9fb0cc" }
    };

    function render(theme) {
      var light = theme === "light";
      mermaid.initialize({
        startOnLoad: false,
        theme: light ? "default" : "dark",
        themeVariables: light ? CLUSTER.light : CLUSTER.dark,
        flowchart: { useMaxWidth: !narrow, curve: "basis" },
        sequence: { useMaxWidth: !narrow },
        er: { useMaxWidth: !narrow },
        class: { useMaxWidth: !narrow }
      });
      nodes.forEach(function (n) {
        n.textContent = n.dataset.mermaidSrc;
        n.removeAttribute("data-processed");   // mermaid skips nodes still marked done
      });
      return Promise.resolve(mermaid.run({ nodes: nodes }))
        .catch(function (e) { console.error("mermaid render failed", e); });
    }

    // Published for the footer theme switch in base.html; absent on pages that
    // include no diagram, which is why that caller checks before calling.
    window.ETSU_RERENDER_MERMAID = render;

    render(document.documentElement.getAttribute("data-theme"));
  })();
</script>
