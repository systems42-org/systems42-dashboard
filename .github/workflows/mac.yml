# Builds and tests the native Mac app. Runs only when the app or this file
# changes, so wiki commits start no macOS job.
name: mac

on:
  pull_request:
    paths: ['_system/apps/dashboard-mac/**', '.github/workflows/mac.yml']
  push:
    branches: [main]
    paths: ['_system/apps/dashboard-mac/**', '.github/workflows/mac.yml']

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      # The diagram libraries are copies of the web dashboard's. Fails when they drift.
      - name: Diagram assets match the dashboard
        run: _system/apps/dashboard-mac/scripts/sync-diagram-assets.sh --check

      - name: Build
        run: swift build --package-path _system/apps/dashboard-mac

      # One test at a time: several tests have time limits, and beside other
      # tests a 0.5 s job took 78 s on this machine.
      - name: Test
        run: swift test --package-path _system/apps/dashboard-mac --no-parallel

      # A build to try out, not a release: signed ad hoc, not notarized.
      # After the download: xattr -dr com.apple.quarantine "Systems42 Dashboard Native.app"
      - name: Build the app
        run: |
          S42_UNIVERSAL=1 _system/apps/dashboard-mac/scripts/build-app.sh
          cd _system/apps/dashboard-mac/build
          # The diagram files must sit inside the app and the signature must hold.
          "Systems42 Dashboard Native.app/Contents/MacOS/Systems42Dashboard" --check-diagram-assets
          codesign --verify --deep --strict "Systems42 Dashboard Native.app"
          ditto -c -k --keepParent "Systems42 Dashboard Native.app" systems42-dashboard-native.zip

      - uses: actions/upload-artifact@v4
        with:
          name: systems42-dashboard-native
          path: _system/apps/dashboard-mac/build/systems42-dashboard-native.zip
          retention-days: 14
