# Publishes a dashboard release (DR-004, FR-030, FR-054, FR-055, DR-007):
# a git tag vX.Y.Z runs Python tests, Go tests and route parity checks, builds
# the multi-arch container image (ghcr.io/systems42-org/dashboard:X.Y.Z), the
# Python wheel for `./dashboard.sh uv`, standalone Go binaries for Linux and
# Windows, and the universal branded macOS `.app`/`.dmg`, then publishes all
# release assets on one GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches VERSION
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          own="$(tr -d '[:space:]' < _system/apps/dashboard/VERSION)"
          if [ "$version" != "$own" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($own)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Python tests (Docker)
        run: ./dashboard.sh test

      - uses: actions/setup-go@v7
        with:
          go-version-file: _system/apps/dashboard/go.mod
          cache-dependency-path: _system/apps/dashboard/go.sum

      - name: Go tests
        working-directory: _system/apps/dashboard
        run: go test -race ./...

      - name: Go build (no cgo)
        working-directory: _system/apps/dashboard
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/systems42-dashboard" ./cmd/systems42-dashboard

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Parity tests
        working-directory: _system/apps/dashboard
        env:
          GO_DASHBOARD_BIN: ${{ runner.temp }}/systems42-dashboard
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python tests/test_parity.py

  image-and-wheel:
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: _system/apps/dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/systems42-org/dashboard:${{ needs.check-and-test.outputs.version }}
            ghcr.io/systems42-org/dashboard:latest

      # The launcher asks for exactly this file name.
      - name: Wheel
        env:
          VERSION: ${{ needs.check-and-test.outputs.version }}
        run: |
          pipx run build --wheel --outdir dist _system/apps/dashboard
          test -f "dist/systems42_dashboard-$VERSION-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  cli-binaries:
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: _system/apps/dashboard/go.mod
          cache-dependency-path: _system/apps/dashboard/go.sum

      - name: Cross-compile static Linux and Windows binaries
        env:
          VERSION: ${{ needs.check-and-test.outputs.version }}
        run: |
          mkdir -p dist stage
          for arch in amd64 arm64; do
            (cd _system/apps/dashboard && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/stage/systems42-dashboard" ./cmd/systems42-dashboard)
            tar -C stage -czf "dist/systems42-dashboard-${VERSION}-linux-${arch}.tar.gz" systems42-dashboard
            rm -f stage/systems42-dashboard
          done
          (cd _system/apps/dashboard && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/stage/systems42-dashboard.exe" ./cmd/systems42-dashboard)
          (cd stage && zip -q "$GITHUB_WORKSPACE/dist/systems42-dashboard-${VERSION}-windows-amd64.zip" systems42-dashboard.exe)
          (cd dist && sha256sum systems42-dashboard-* > "systems42-dashboard-${VERSION}-cli.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/*

  macos-app:
    needs: check-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: _system/apps/dashboard/go.mod
          cache-dependency-path: _system/apps/dashboard/go.sum

      - name: Import Apple signing certificate (when configured)
        env:
          APPLE_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
          APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_SIGN_PASSWORD }}
        run: |
          if [ -z "${APPLE_SIGN_P12:-}" ] || [ -z "${APPLE_SIGN_PASSWORD:-}" ]; then
            echo "→ No Apple signing certificate configured; build will use ad-hoc signing."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"

      - name: Prepare Apple notarisation key (when configured)
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          if [ -z "${APPLE_NOTARY_KEY:-}" ]; then
            echo "→ No Apple notarisation key configured; skipping notarisation."
            exit 0
          fi
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build universal macOS app and DMG
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./_system/apps/dashboard/macos/build-app.sh --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  publish:
    needs: [check-and-test, image-and-wheel, cli-binaries, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-and-test.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes dist/*
