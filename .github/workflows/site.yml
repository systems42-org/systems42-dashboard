# Builds dashboard.systems42.org into site/_site/ and deploys that folder
# directly to GitHub Pages via GitHub Actions (no gh-pages branch).
#
# Publishes on every push to main and after every release. Builds and checks,
# without publishing, on every pull request.
#
# Repository setup (Settings -> Pages):
#   Source: GitHub Actions
#   Custom domain: dashboard.systems42.org (DNS CNAME -> systems42-org.github.io.)
#
# To switch the /demo/ showcase to another public Systems42 wiki (such as
# systems42-org/isaqb-atrium), set repository variable SITE_DEMO_WIKI_REPO or
# pass `demo_wiki_repo` when triggering this workflow manually.
name: site

on:
  # Every merge to main publishes the site. No path filter: the demo shows the
  # whole repository (wiki, metamodel, anchors, log), so any change can show.
  push:
    branches: [main]
  # A pull request builds the site and runs its checks, without publishing.
  pull_request:
  # Once a release is published its downloads exist: publish again, so the
  # links of the new release number never stay broken.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      demo_wiki_repo:
        description: "Optional owner/repo to export as /demo/ (empty = this repository)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # After a release run, only for a release tag (v1.2.3), not for its other runs.
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v7

      - name: Optional checkout of external demo wiki
        id: demo
        env:
          INPUT_REPO: ${{ github.event.inputs.demo_wiki_repo }}
          VAR_REPO: ${{ vars.SITE_DEMO_WIKI_REPO }}
        run: |
          repo="${INPUT_REPO:-$VAR_REPO}"
          if [ -n "$repo" ]; then
            git clone --depth 1 "https://github.com/${repo}.git" /tmp/demo-wiki
            echo "path=/tmp/demo-wiki" >> "$GITHUB_OUTPUT"
          else
            echo "path=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build static site
        run: make site DEMO_WIKI="${{ steps.demo.outputs.path }}"

      - name: Upload site/_site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
